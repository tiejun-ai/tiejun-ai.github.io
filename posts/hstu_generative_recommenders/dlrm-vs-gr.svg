<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Traditional DLRM compared with a Generative Recommender</title>
  <desc id="desc">A traditional DLRM processes many separately engineered categorical and numerical features through specialized modules. A Generative Recommender serializes raw events and slowly changing categorical features into one chronological sequence processed by repeated HSTU blocks.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .title{font:700 28px system-ui,sans-serif;fill:#0f172a}.label{font:650 18px system-ui,sans-serif;fill:#0f172a}.small{font:15px system-ui,sans-serif;fill:#334155}.tiny{font:13px system-ui,sans-serif;fill:#475569}.box{stroke-width:2;rx:14}.arrow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="650" fill="#f8fafc" rx="20"/>
  <text x="300" y="48" class="title" text-anchor="middle">Traditional DLRM</text>
  <text x="900" y="48" class="title" text-anchor="middle">Generative Recommender</text>
  <line x1="600" y1="28" x2="600" y2="620" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 8"/>

  <rect x="40" y="82" width="155" height="78" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="117" y="112" class="label" text-anchor="middle">Categorical</text>
  <text x="117" y="137" class="small" text-anchor="middle">item, creator,</text>
  <text x="117" y="157" class="small" text-anchor="middle">user, topic IDs</text>
  <rect x="40" y="210" width="155" height="78" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="117" y="240" class="label" text-anchor="middle">Numerical</text>
  <text x="117" y="265" class="small" text-anchor="middle">counts, ratios,</text>
  <text x="117" y="285" class="small" text-anchor="middle">decayed stats</text>
  <rect x="40" y="338" width="155" height="78" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="117" y="368" class="label" text-anchor="middle">Context</text>
  <text x="117" y="393" class="small" text-anchor="middle">device, locale,</text>
  <text x="117" y="413" class="small" text-anchor="middle">request features</text>

  <rect x="250" y="82" width="155" height="78" class="box" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="327" y="112" class="label" text-anchor="middle">Embedding</text>
  <text x="327" y="138" class="small" text-anchor="middle">tables + pooling</text>
  <rect x="250" y="210" width="155" height="78" class="box" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="327" y="240" class="label" text-anchor="middle">Bottom MLPs</text>
  <text x="327" y="266" class="small" text-anchor="middle">feature transforms</text>
  <rect x="250" y="338" width="155" height="78" class="box" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="327" y="368" class="label" text-anchor="middle">Attention</text>
  <text x="327" y="394" class="small" text-anchor="middle">history pooling</text>
  <path d="M195 121 H242" class="arrow"/><path d="M195 249 H242" class="arrow"/><path d="M195 377 H242" class="arrow"/>

  <rect x="452" y="145" width="112" height="205" class="box" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="508" y="185" class="label" text-anchor="middle">Feature</text>
  <text x="508" y="209" class="label" text-anchor="middle">interactions</text>
  <text x="508" y="245" class="small" text-anchor="middle">DCN / FM</text>
  <text x="508" y="269" class="small" text-anchor="middle">MoE / PLE</text>
  <text x="508" y="293" class="small" text-anchor="middle">top MLPs</text>
  <path d="M405 121 C430 121 430 185 444 185" class="arrow"/>
  <path d="M405 249 H444" class="arrow"/>
  <path d="M405 377 C430 377 430 310 444 310" class="arrow"/>
  <rect x="452" y="423" width="112" height="64" class="box" fill="#fee2e2" stroke="#dc2626"/>
  <text x="508" y="451" class="label" text-anchor="middle">Scores</text>
  <text x="508" y="474" class="small" text-anchor="middle">many tasks</text>
  <path d="M508 350 V415" class="arrow"/>

  <text x="300" y="552" class="label" text-anchor="middle">Many feature families, many modules</text>
  <text x="300" y="579" class="small" text-anchor="middle">Hand-engineered aggregates encode past behavior</text>

  <rect x="650" y="82" width="500" height="104" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="900" y="112" class="label" text-anchor="middle">One chronological event stream</text>
  <g class="small" text-anchor="middle">
    <rect x="680" y="132" width="76" height="34" rx="8" fill="#bfdbfe"/><text x="718" y="155">item A</text>
    <rect x="767" y="132" width="76" height="34" rx="8" fill="#bbf7d0"/><text x="805" y="155">like</text>
    <rect x="854" y="132" width="76" height="34" rx="8" fill="#bfdbfe"/><text x="892" y="155">item B</text>
    <rect x="941" y="132" width="76" height="34" rx="8" fill="#fecaca"/><text x="979" y="155">skip</text>
    <rect x="1028" y="132" width="92" height="34" rx="8" fill="#ddd6fe"/><text x="1074" y="155">creator C</text>
  </g>
  <path d="M900 186 V221" class="arrow"/>

  <rect x="727" y="230" width="346" height="72" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="900" y="261" class="label" text-anchor="middle">HSTU block</text>
  <text x="900" y="286" class="small" text-anchor="middle">attention + interaction + gating</text>
  <rect x="727" y="326" width="346" height="72" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="900" y="357" class="label" text-anchor="middle">HSTU block</text>
  <text x="900" y="382" class="small" text-anchor="middle">same modular computation</text>
  <text x="1092" y="350" class="label">x L</text>
  <path d="M900 302 V318" class="arrow"/>
  <path d="M900 398 V433" class="arrow"/>
  <rect x="770" y="442" width="260" height="64" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="900" y="470" class="label" text-anchor="middle">Predictions at many positions</text>
  <text x="900" y="494" class="small" text-anchor="middle">ranking actions or retrieval items</text>
  <text x="900" y="552" class="label" text-anchor="middle">Raw actions become the modeling language</text>
  <text x="900" y="579" class="small" text-anchor="middle">Learned sequence computation replaces many aggregates</text>
</svg>
