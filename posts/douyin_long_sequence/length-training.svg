<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc">
  <title id="title">Stochastic training length averages 2K while including 10K histories</title>
  <desc id="desc">A schematic shows training windows with variable lengths, including occasional long windows up to 10K. Training retains the most recent interactions and packs batches near an average of 2K tokens per example. Inference uses up to 10K interactions. The bars are illustrative rather than measured samples.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#64748b"/></marker>
    <style>.title{font-family:Arial,Helvetica,sans-serif;font-size:27px;font-weight:700;fill:#0f172a}.label{font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:650;fill:#0f172a}.text{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#334155}.small{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#475569}.arr{stroke:#64748b;stroke-width:2.4;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1100" height="610" rx="20" fill="#f8fafc"/>
  <text x="550" y="48" class="title" text-anchor="middle">2K average training length; 10K maximum</text>
  <text x="550" y="82" class="text" text-anchor="middle">Many short windows + occasional long windows → train across lengths</text>
  <rect x="40" y="115" width="625" height="335" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="65" y="152" class="label">Training windows (illustrative)</text>
  <text x="65" y="184" class="small">Older interactions</text><text x="625" y="184" class="small" text-anchor="end">Most recent</text>
  <path d="M225 177 H449" class="arr"/>
  <rect x="65" y="210" width="560" height="30" rx="5" fill="#dbeafe"/>
  <rect x="574" y="210" width="51" height="30" rx="5" fill="#2563eb"/>
  <rect x="65" y="263" width="560" height="30" rx="5" fill="#dbeafe"/>
  <rect x="560" y="263" width="65" height="30" rx="5" fill="#2563eb"/>
  <rect x="65" y="316" width="560" height="30" rx="5" fill="#dbeafe"/>
  <rect x="513" y="316" width="112" height="30" rx="5" fill="#2563eb"/>
  <rect x="65" y="369" width="560" height="30" rx="5" fill="#2563eb"/>
  <text x="81" y="391" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;font-weight:650;fill:#fff">Occasional long window: up to 10K</text>
  <text x="65" y="430" class="small">Blue = retained temporal suffix; pale = omitted older history</text>
  <path d="M665 280 H704" class="arr"/>
  <rect x="710" y="210" width="350" height="160" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="885" y="249" class="label" text-anchor="middle">Balance + pack batches</text>
  <text x="885" y="284" class="text" text-anchor="middle">≈ 2K tokens per example on average</text>
  <text x="885" y="316" class="small" text-anchor="middle">Ragged attention avoids padding</text>
  <text x="885" y="344" class="small" text-anchor="middle">Each query reads its own history</text>
  <rect x="40" y="479" width="1020" height="83" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="65" y="514" class="label">Inference</text>
  <rect x="230" y="498" width="800" height="43" rx="7" fill="#16a34a"/>
  <text x="630" y="527" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:650;fill:#fff">Read up to 10K recent interactions</text>
  <text x="550" y="591" class="small" text-anchor="middle">A 2K training average does not impose a 2K training maximum.</text>
</svg>
