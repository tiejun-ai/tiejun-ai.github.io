<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
  <title id="title">Causal self-attention over a history and candidate sequence</title>
  <desc id="desc">A schematic sequence of five historical positions and one candidate enters causal self-attention. Blue lower-triangular entries allow history positions to read earlier positions; the amber final row lets the candidate read the history. The candidate's contextual representation feeds a ranking head. Dense attention retains quadratic dependence on sequence length.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#64748b"/></marker>
    <style>.title{font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:700;fill:#0f172a}.label{font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:650;fill:#0f172a}.text{font-family:Arial,Helvetica,sans-serif;font-size:18px;fill:#334155}.small{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#475569}.arr{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.box{stroke-width:2;rx:13}</style>
  </defs>
  <rect width="1100" height="760" rx="20" fill="#f8fafc"/>
  <text x="550" y="47" class="title" text-anchor="middle">Sequence attention: history positions interact</text>
  <rect x="45" y="90" width="1010" height="130" class="box" fill="#eff6ff" stroke="#2563eb"/>
  <text x="70" y="124" class="label">History tokens + candidate (simplified)</text>
  <g class="label" text-anchor="middle">
    <rect x="70" y="148" width="135" height="46" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="137" y="179">h₁</text>
    <rect x="230" y="148" width="135" height="46" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="297" y="179">h₂</text>
    <rect x="390" y="148" width="135" height="46" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="457" y="179">h₃</text>
    <rect x="550" y="148" width="135" height="46" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="617" y="179">h₄</text>
    <rect x="710" y="148" width="135" height="46" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="777" y="179">h₅</text>
    <rect x="870" y="148" width="160" height="46" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="950" y="179">candidate t</text>
  </g>
  <path d="M355 220 V267" class="arr"/>
  <rect x="45" y="270" width="625" height="360" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="70" y="308" class="label">Causal self-attention layers</text>
  <text x="242" y="342" class="small" text-anchor="middle">Key positions</text>
  <g class="small" text-anchor="middle">
    <text x="139" y="369">h₁</text><text x="179" y="369">h₂</text><text x="219" y="369">h₃</text><text x="259" y="369">h₄</text><text x="299" y="369">h₅</text><text x="339" y="369">t</text>
    <text x="98" y="403">h₁</text><text x="98" y="443">h₂</text><text x="98" y="483">h₃</text><text x="98" y="523">h₄</text><text x="98" y="563">h₅</text><text x="98" y="603">t</text>
  </g>
  <rect x="120" y="379" width="238" height="238" rx="3" fill="#f8fafc"/>
  <g fill="#60a5fa">
    <rect x="120" y="379" width="38" height="38" rx="3"/>
    <rect x="120" y="419" width="78" height="38" rx="3"/>
    <rect x="120" y="459" width="118" height="38" rx="3"/>
    <rect x="120" y="499" width="158" height="38" rx="3"/>
    <rect x="120" y="539" width="198" height="38" rx="3"/>
  </g>
  <rect x="120" y="579" width="238" height="38" rx="3" fill="#fbbf24"/>
  <g stroke="#ede9fe" stroke-width="2"><path d="M159 379 V617 M199 379 V617 M239 379 V617 M279 379 V617 M319 379 V617"/></g>
  <text x="405" y="396" class="text">Blue: history positions</text>
  <text x="405" y="425" class="text">read earlier history</text>
  <text x="405" y="480" class="text">Pale: future positions</text>
  <text x="405" y="509" class="text">are masked</text>
  <text x="405" y="564" class="text">Amber: candidate</text>
  <text x="405" y="593" class="text">reads the history</text>
  <text x="902" y="316" class="label" text-anchor="middle">Dense attention: O(L²)</text>
  <text x="902" y="349" class="small" text-anchor="middle">at fixed model width</text>
  <path d="M670 450 H747" class="arr"/>
  <text x="710" y="399" class="small" text-anchor="middle">candidate</text>
  <text x="710" y="422" class="small" text-anchor="middle">output</text>
  <rect x="750" y="405" width="305" height="90" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="902" y="442" class="label" text-anchor="middle">Ranking head</text>
  <text x="902" y="474" class="text" text-anchor="middle">Contextual candidate representation</text>
  <path d="M902 495 V552" class="arr"/>
  <rect x="750" y="555" width="305" height="75" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="902" y="600" class="label" text-anchor="middle">P(response | history, t)</text>
  <text x="550" y="684" class="text" text-anchor="middle">Causal masking reduces allowed connections, but their count still grows quadratically.</text>
  <text x="550" y="726" class="small" text-anchor="middle">A small example of the history–history attention pattern; actual item/action tokenization varies by model.</text>
</svg>
