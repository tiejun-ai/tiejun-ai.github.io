<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="750" viewBox="0 0 1100 750" role="img" aria-labelledby="title desc">
<title id="title">Agent = LLM + Agent Harness</title><desc id="desc">An agent harness contains a repeating build-context, LLM, and execute-tool cycle, with a final-answer exit and runtime support for workspace facts, memory, permissions and budgets.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#526C81"/></marker></defs>
<style>text {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill:#162B40;} .mono {font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;}</style>
<rect width="1100" height="750" fill="#F8FAFD"/>

<text x="48" y="54" font-size="32" font-weight="700" text-anchor="start" style="fill:#162B40">Agent = LLM + Agent Harness</text>
<text x="48" y="91" font-size="21" font-weight="400" text-anchor="start" style="fill:#4B6175">The model chooses actions; the harness supplies context, execution, and state.</text>
<rect x="40" y="132" width="1020" height="558" rx="16" fill="#FFFFFF" stroke="#D6E0EA" stroke-width="1.6"/>
<text x="70" y="174" font-size="18" font-weight="600" text-anchor="start" style="fill:#7354AC">AGENT HARNESS</text>
<text x="1030" y="174" font-size="18" font-weight="600" text-anchor="end" style="fill:#4B6175">Loop + runtime support</text>
<rect x="80" y="230" width="260" height="124" rx="16" fill="#F2EDFA" stroke="#CABBE2" stroke-width="1.6"/>
<text x="210" y="268" font-size="27" font-weight="700" text-anchor="middle" style="fill:#162B40">Build context</text>
<text x="210" y="303" font-size="20" font-weight="400" text-anchor="middle" style="fill:#4B6175">Prefix + memory + history</text>
<text x="210" y="330" font-size="20" font-weight="400" text-anchor="middle" style="fill:#4B6175">+ current user request</text>
<rect x="420" y="230" width="260" height="124" rx="16" fill="#EAF2FF" stroke="#AAC8ED" stroke-width="1.6"/>
<text x="550" y="268" font-size="27" font-weight="700" text-anchor="middle" style="fill:#162B40">LLM</text>
<text x="550" y="303" font-size="20" font-weight="400" text-anchor="middle" style="fill:#4B6175">Interpret the task</text>
<text x="550" y="330" font-size="20" font-weight="400" text-anchor="middle" style="fill:#4B6175">Choose the next action</text>
<rect x="760" y="230" width="260" height="124" rx="16" fill="#E7F6F2" stroke="#9FD4C8" stroke-width="1.6"/>
<text x="890" y="268" font-size="27" font-weight="700" text-anchor="middle" style="fill:#162B40">Execute tool</text>
<text x="890" y="303" font-size="20" font-weight="400" text-anchor="middle" style="fill:#4B6175">Validate, approve, run</text>
<text x="890" y="330" font-size="20" font-weight="400" text-anchor="middle" style="fill:#4B6175">Read / edit / shell / delegate</text>
<path d="M340 292 H420" fill="none" stroke="#526C81" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="380" y="272" font-size="18" font-weight="600" text-anchor="middle" style="fill:#4B6175">prompt</text>
<path d="M680 292 H760" fill="none" stroke="#526C81" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="720" y="272" font-size="18" font-weight="600" text-anchor="middle" style="fill:#4B6175">tool call</text>
<rect x="420" y="400" width="260" height="66" rx="16" fill="#EAF2FF" stroke="#AAC8ED" stroke-width="1.6"/>
<text x="550" y="441" font-size="25" font-weight="600" text-anchor="middle" style="fill:#162B40">Final answer</text>
<path d="M550 354 V400" fill="none" stroke="#526C81" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M890 354 V500 H210 V354" fill="none" stroke="#526C81" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="550" y="488" font-size="20" font-weight="400" text-anchor="middle" style="fill:#4B6175">Tool result → update state → rebuild context</text>
<text x="80" y="544" font-size="18" font-weight="600" text-anchor="start" style="fill:#7354AC">RUNTIME SUPPORT</text>
<rect x="80" y="563" width="300" height="94" rx="16" fill="#F8FAFD" stroke="#D6E0EA" stroke-width="1.6"/>
<text x="230" y="598" font-size="21" font-weight="650" text-anchor="middle" style="fill:#162B40">Workspace + instructions</text>
<text x="230" y="632" font-size="17" font-weight="400" text-anchor="middle" style="fill:#4B6175">Project facts, rules, tool registry</text>
<rect x="400" y="563" width="300" height="94" rx="16" fill="#F8FAFD" stroke="#D6E0EA" stroke-width="1.6"/>
<text x="550" y="598" font-size="21" font-weight="650" text-anchor="middle" style="fill:#162B40">Memory + transcript</text>
<text x="550" y="632" font-size="17" font-weight="400" text-anchor="middle" style="fill:#4B6175">Continuity, compaction, persistence</text>
<rect x="720" y="563" width="300" height="94" rx="16" fill="#F8FAFD" stroke="#D6E0EA" stroke-width="1.6"/>
<text x="870" y="598" font-size="21" font-weight="650" text-anchor="middle" style="fill:#162B40">Permissions + budgets</text>
<text x="870" y="632" font-size="17" font-weight="400" text-anchor="middle" style="fill:#4B6175">Allowed actions and stopping limits</text>
<text x="1050" y="728" font-size="16" font-weight="400" text-anchor="end" style="fill:#4B6175">tiejun-ai.github.io</text>
</svg>