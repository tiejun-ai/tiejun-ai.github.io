<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
<title id="title">From generated text to a tool result</title><desc id="desc">A tool request generated as text is parsed, validated, approved when required, and executed in Python. Output or errors are recorded and included in the next prompt.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#526C81"/></marker></defs>
<style>text {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill:#162B40;} .mono {font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;}</style>
<rect width="1100" height="720" fill="#F8FAFD"/>

<text x="48" y="54" font-size="32" font-weight="700" text-anchor="start" style="fill:#162B40">From generated text to a tool result</text>
<text x="48" y="91" font-size="21" font-weight="400" text-anchor="start" style="fill:#4B6175">Mini Coding Agent parses tool requests from ordinary model output.</text>
<rect x="50" y="127" width="1000" height="102" rx="16" fill="#EAF2FF" stroke="#AAC8ED" stroke-width="1.6"/>
<text x="76" y="158" font-size="18" font-weight="600" text-anchor="start" style="fill:#2063B8">MODEL OUTPUT</text>
<text x="550" y="199" font-size="21" font-weight="400" text-anchor="middle" style="fill:#162B40" class="mono">&lt;tool&gt;{&quot;name&quot;:&quot;read_file&quot;,&quot;args&quot;:{&quot;path&quot;:&quot;README.md&quot;}}&lt;/tool&gt;</text>
<rect x="50" y="309" width="220" height="128" rx="16" fill="#F2EDFA" stroke="#CABBE2" stroke-width="1.6"/>
<text x="160" y="348" font-size="24" font-weight="700" text-anchor="middle" style="fill:#162B40">1  Parse</text>
<text x="160" y="384" font-size="20" font-weight="400" text-anchor="middle" style="fill:#4B6175">Extract tool name</text>
<text x="160" y="411" font-size="20" font-weight="400" text-anchor="middle" style="fill:#4B6175">and arguments</text>
<text x="160" y="471" font-size="18" font-weight="400" text-anchor="middle" style="fill:#4B6175">Malformed → retry</text>
<rect x="310" y="309" width="220" height="128" rx="16" fill="#F2EDFA" stroke="#CABBE2" stroke-width="1.6"/>
<text x="420" y="348" font-size="24" font-weight="700" text-anchor="middle" style="fill:#162B40">2  Validate</text>
<text x="420" y="384" font-size="20" font-weight="400" text-anchor="middle" style="fill:#4B6175">Check tool, inputs,</text>
<text x="420" y="411" font-size="20" font-weight="400" text-anchor="middle" style="fill:#4B6175">paths, repeated calls</text>
<text x="420" y="471" font-size="18" font-weight="400" text-anchor="middle" style="fill:#4B6175">Invalid → tool error</text>
<rect x="570" y="309" width="220" height="128" rx="16" fill="#FFF5DE" stroke="#E4CB8E" stroke-width="1.6"/>
<text x="680" y="348" font-size="24" font-weight="700" text-anchor="middle" style="fill:#162B40">3  Approve</text>
<text x="680" y="384" font-size="20" font-weight="400" text-anchor="middle" style="fill:#4B6175">Apply permissions</text>
<text x="680" y="411" font-size="20" font-weight="400" text-anchor="middle" style="fill:#4B6175">when required</text>
<text x="680" y="471" font-size="18" font-weight="400" text-anchor="middle" style="fill:#4B6175">Denied → tool error</text>
<rect x="830" y="309" width="220" height="128" rx="16" fill="#E7F6F2" stroke="#9FD4C8" stroke-width="1.6"/>
<text x="940" y="348" font-size="24" font-weight="700" text-anchor="middle" style="fill:#162B40">4  Execute</text>
<text x="940" y="384" font-size="20" font-weight="400" text-anchor="middle" style="fill:#4B6175">Run the registered</text>
<text x="940" y="411" font-size="20" font-weight="400" text-anchor="middle" style="fill:#4B6175">Python function</text>
<text x="940" y="471" font-size="18" font-weight="400" text-anchor="middle" style="fill:#4B6175">Failure → tool error</text>
<path d="M160 229 V309" fill="none" stroke="#526C81" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M270 373 H310" fill="none" stroke="#526C81" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M530 373 H570" fill="none" stroke="#526C81" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M790 373 H830" fill="none" stroke="#526C81" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="50" y="544" width="480" height="104" rx="16" fill="#E7F6F2" stroke="#9FD4C8" stroke-width="1.6"/>
<text x="290" y="580" font-size="25" font-weight="700" text-anchor="middle" style="fill:#162B40">Tool execution result</text>
<text x="290" y="616" font-size="20" font-weight="400" text-anchor="middle" style="fill:#4B6175">Clip output · record event · update memory</text>
<rect x="640" y="544" width="410" height="104" rx="16" fill="#F2EDFA" stroke="#CABBE2" stroke-width="1.6"/>
<text x="845" y="580" font-size="25" font-weight="700" text-anchor="middle" style="fill:#162B40">Next LLM prompt</text>
<text x="845" y="616" font-size="20" font-weight="400" text-anchor="middle" style="fill:#4B6175">Result enters via the compact transcript</text>
<path d="M1050 373 H1074 V507 H290 V544" fill="none" stroke="#526C81" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M530 596 H640" fill="none" stroke="#526C81" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="50" y="689" font-size="19" font-weight="400" text-anchor="start" style="fill:#4B6175">Formatting feedback and tool errors also return to the agentic loop.</text>
<text x="1050" y="698" font-size="16" font-weight="400" text-anchor="end" style="fill:#4B6175">tiejun-ai.github.io</text>
</svg>