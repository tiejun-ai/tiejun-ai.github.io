<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="870" viewBox="0 0 1100 870" role="img" aria-labelledby="title desc">
<title id="title">Store the session; select the context</title><desc id="desc">Session events update recorded history and working memory, saved together in session JSON. history_text reduces history into a compact transcript; memory_text formats working memory. Both are included in the next prompt. Saved state can be reloaded to resume.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#526C81"/></marker></defs>
<style>text {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill:#162B40;} .mono {font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;}</style>
<rect width="1100" height="870" fill="#F8FAFD"/>

<text x="48" y="54" font-size="32" font-weight="700" text-anchor="start" style="fill:#162B40">Store the session; select the context</text>
<text x="48" y="91" font-size="21" font-weight="400" text-anchor="start" style="fill:#4B6175">Persistence supports resumption. Prompt construction controls what the LLM sees.</text>
<rect x="50" y="124" width="1000" height="75" rx="16" fill="#EAF2FF" stroke="#AAC8ED" stroke-width="1.6"/>
<text x="550" y="155" font-size="25" font-weight="700" text-anchor="middle" style="fill:#162B40">Session events</text>
<text x="550" y="183" font-size="21" font-weight="400" text-anchor="middle" style="fill:#4B6175">User requests · tool calls and results · LLM answers</text>
<path d="M550 199 V244" fill="none" stroke="#526C81" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="50" y="244" width="1000" height="220" rx="16" fill="#FFFFFF" stroke="#CABBE2" stroke-width="1.6"/>
<text x="78" y="279" font-size="18" font-weight="600" text-anchor="start" style="fill:#7354AC">SESSION JSON ON DISK</text>
<text x="1020" y="279" font-size="18" font-weight="600" text-anchor="end" style="fill:#7354AC">SessionStore.save()</text>
<rect x="80" y="310" width="440" height="119" rx="16" fill="#E7F6F2" stroke="#9FD4C8" stroke-width="1.6"/>
<text x="300" y="350" font-size="25" font-weight="700" text-anchor="middle" style="fill:#162B40">Recorded conversation history</text>
<text x="300" y="385" font-size="19" font-weight="400" text-anchor="middle" style="fill:#4B6175">Chronological user, tool, and assistant events</text>
<rect x="580" y="310" width="440" height="119" rx="16" fill="#FFF5DE" stroke="#E4CB8E" stroke-width="1.6"/>
<text x="800" y="350" font-size="25" font-weight="700" text-anchor="middle" style="fill:#162B40">Working memory</text>
<text x="800" y="385" font-size="22" font-weight="400" text-anchor="middle" style="fill:#4B6175" class="mono">task · files · notes</text>
<path d="M300 429 V541" fill="none" stroke="#526C81" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M800 429 V541" fill="none" stroke="#526C81" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="80" y="541" width="440" height="111" rx="16" fill="#E7F6F2" stroke="#9FD4C8" stroke-width="1.6"/>
<text x="300" y="578" font-size="24" font-weight="650" text-anchor="middle" style="fill:#162B40" class="mono">history_text()</text>
<text x="300" y="614" font-size="20" font-weight="400" text-anchor="middle" style="fill:#4B6175">Clip + deduplicate → compact transcript</text>
<rect x="580" y="541" width="440" height="111" rx="16" fill="#FFF5DE" stroke="#E4CB8E" stroke-width="1.6"/>
<text x="800" y="578" font-size="24" font-weight="650" text-anchor="middle" style="fill:#162B40" class="mono">memory_text()</text>
<text x="800" y="614" font-size="21" font-weight="400" text-anchor="middle" style="fill:#4B6175">Format task, files, and notes</text>
<path d="M300 652 V689 H550 V723" fill="none" stroke="#526C81" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M800 652 V689 H550" fill="none" stroke="#526C81" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="50" y="723" width="1000" height="74" rx="16" fill="#F2EDFA" stroke="#CABBE2" stroke-width="1.6"/>
<text x="550" y="754" font-size="25" font-weight="700" text-anchor="middle" style="fill:#162B40">Next LLM prompt</text>
<text x="550" y="783" font-size="21" font-weight="400" text-anchor="middle" style="fill:#4B6175">Stable prefix + working memory + compact transcript + current request</text>
<text x="50" y="837" font-size="19" font-weight="400" text-anchor="start" style="fill:#4B6175">Reload saved JSON to resume a session after an interruption.</text>
<text x="1050" y="848" font-size="16" font-weight="400" text-anchor="end" style="fill:#4B6175">tiejun-ai.github.io</text>
</svg>