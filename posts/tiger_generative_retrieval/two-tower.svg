<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 372" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="372" fill="#ffffff"/>

  <!-- match score -->
  <text x="350" y="26" text-anchor="middle" font-size="14.5" font-weight="700" fill="#444">match score = sim(user_emb, item_emb)</text>
  <line x1="350" y1="52" x2="350" y2="34" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- dot product -->
  <rect x="240" y="52" width="220" height="40" rx="10" fill="#f4f4f4" stroke="#ccc" stroke-width="1.2"/>
  <text x="350" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#444">dot product</text>

  <!-- arrows towers -> dot product -->
  <line x1="160" y1="178" x2="278" y2="96" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="540" y1="178" x2="422" y2="96" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="192" y="122" text-anchor="middle" font-size="12.5" font-style="italic" fill="#1c3a5e">user_emb</text>
  <text x="508" y="122" text-anchor="middle" font-size="12.5" font-style="italic" fill="#7a5a12">item_emb</text>

  <!-- shared space note -->
  <text x="350" y="154" text-anchor="middle" font-size="12" font-style="italic" fill="#555">same shared embedding space</text>

  <!-- User tower -->
  <rect x="95" y="180" width="130" height="66" rx="10" fill="#cfe3f7" stroke="#6aa3d5" stroke-width="1.4"/>
  <text x="160" y="208" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1c3a5e">User Tower</text>
  <text x="160" y="228" text-anchor="middle" font-size="12.5" fill="#1c3a5e">(MLP)</text>

  <!-- Item tower -->
  <rect x="475" y="180" width="130" height="66" rx="10" fill="#fdf0c9" stroke="#e0b84c" stroke-width="1.4"/>
  <text x="540" y="208" text-anchor="middle" font-size="14.5" font-weight="700" fill="#7a5a12">Item Tower</text>
  <text x="540" y="228" text-anchor="middle" font-size="12.5" fill="#7a5a12">(MLP)</text>

  <!-- feature arrows -->
  <line x1="160" y1="288" x2="160" y2="250" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="540" y1="288" x2="540" y2="250" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- features -->
  <text x="160" y="306" text-anchor="middle" font-size="12.5" font-weight="700" fill="#444">user features</text>
  <text x="160" y="326" text-anchor="middle" font-size="12" fill="#555">history of item IDs,</text>
  <text x="160" y="344" text-anchor="middle" font-size="12" fill="#555">user ID / profile, context</text>

  <text x="540" y="306" text-anchor="middle" font-size="12.5" font-weight="700" fill="#444">item features</text>
  <text x="540" y="326" text-anchor="middle" font-size="12" fill="#555">item ID, category,</text>
  <text x="540" y="344" text-anchor="middle" font-size="12" fill="#555">brand, text, price &#8230;</text>
</svg>
