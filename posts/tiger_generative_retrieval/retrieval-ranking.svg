<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 142" font-family="'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="142" fill="#ffffff"/>

  <!-- Item corpus -->
  <rect x="15" y="52" width="130" height="66" rx="10" fill="#fdf0c9" stroke="#e0b84c" stroke-width="1.4"/>
  <text x="80" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#7a5a12">Item Corpus</text>
  <text x="80" y="99" text-anchor="middle" font-size="12" fill="#7a5a12">millions&#8211;billions</text>

  <line x1="147" y1="85" x2="185" y2="85" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Retrieval -->
  <rect x="192" y="44" width="180" height="82" rx="10" fill="#cfe3f7" stroke="#6aa3d5" stroke-width="1.4"/>
  <text x="282" y="74" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1c3a5e">Retrieval (quick)</text>
  <text x="282" y="94" text-anchor="middle" font-size="12.5" fill="#1c3a5e">candidate generation</text>
  <text x="282" y="112" text-anchor="middle" font-size="12" font-style="italic" fill="#3c6d9e">TIGER lives here</text>

  <line x1="374" y1="85" x2="466" y2="85" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="420" y="60" text-anchor="middle" font-size="11.5" fill="#555">~hundreds of</text>
  <text x="420" y="76" text-anchor="middle" font-size="11.5" fill="#555">candidates</text>

  <!-- Ranking -->
  <rect x="473" y="44" width="180" height="82" rx="10" fill="#d9f0d9" stroke="#7fbf7f" stroke-width="1.4"/>
  <text x="563" y="79" text-anchor="middle" font-size="14.5" font-weight="700" fill="#2a6b2a">Ranking (heavy)</text>
  <text x="563" y="99" text-anchor="middle" font-size="12.5" fill="#2a6b2a">score &amp; order</text>

  <line x1="655" y1="85" x2="693" y2="85" stroke="#555" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="723" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#444">final</text>
  <text x="723" y="97" text-anchor="middle" font-size="12.5" font-weight="700" fill="#444">top-N</text>
</svg>
