<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">SWE-agent's ReAct-style agent loop</title>
  <desc id="desc">A GitHub issue and repository enter an LLM agent. The agent reasons, chooses a search, view, edit, or execute action through the Agent-Computer Interface, receives concise feedback from the repository, linter, or tests, and repeats until it submits a patch.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2673c9"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1098" height="538" rx="18" fill="#ffffff" stroke="#d9e0e7" stroke-width="2"/>
  <text x="550" y="43" text-anchor="middle" font-size="24" font-weight="700" fill="#172b3a">SWE-agent's ReAct-Style Agent Loop</text>
  <text x="550" y="69" text-anchor="middle" font-size="15" fill="#667784">Reason → act through the ACI → observe → repeat</text>

  <!-- Task input -->
  <rect x="50" y="116" width="205" height="112" rx="12" fill="#f6f8fa" stroke="#8b98a5" stroke-width="2"/>
  <path d="M70 139 h38 l14 14 v51 h-52 z" fill="#ffffff" stroke="#687784" stroke-width="2"/>
  <path d="M108 139 v14 h14" fill="none" stroke="#687784" stroke-width="2"/>
  <text x="181" y="160" text-anchor="middle" font-size="17" font-weight="700" fill="#263746">GitHub issue</text>
  <text x="181" y="185" text-anchor="middle" font-size="14" fill="#586a78">+ repository</text>
  <text x="181" y="207" text-anchor="middle" font-size="13" fill="#7a8894">task and current state</text>

  <!-- Input arrow -->
  <path d="M255 172 H330" fill="none" stroke="#52606d" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- LLM -->
  <rect x="340" y="105" width="240" height="134" rx="14" fill="#eaf3fd" stroke="#2673c9" stroke-width="2.5"/>
  <circle cx="386" cy="151" r="23" fill="#ffffff" stroke="#2673c9" stroke-width="2"/>
  <path d="M375 151 c0-10 7-16 14-16 10 0 16 7 16 16 0 8-5 13-11 16 v8 h-13 v-8 c-4-3-6-8-6-16z" fill="none" stroke="#2673c9" stroke-width="2"/>
  <text x="480" y="142" text-anchor="middle" font-size="18" font-weight="700" fill="#174f8a">LLM agent</text>
  <text x="480" y="168" text-anchor="middle" font-size="15" fill="#315d83">reason about the next step</text>
  <rect x="389" y="190" width="142" height="30" rx="15" fill="#ffffff" stroke="#91b9e4"/>
  <text x="460" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="#2673c9">THOUGHT</text>

  <!-- LLM to ACI -->
  <path d="M580 172 H654" fill="none" stroke="#2673c9" stroke-width="2.8" marker-end="url(#arrow-blue)"/>
  <text x="617" y="158" text-anchor="middle" font-size="13" font-weight="600" fill="#2673c9">ACTION</text>

  <!-- ACI -->
  <rect x="665" y="92" width="385" height="160" rx="14" fill="#fff4e8" stroke="#d7792b" stroke-width="2.5"/>
  <text x="858" y="126" text-anchor="middle" font-size="19" font-weight="700" fill="#8c4512">Agent-Computer Interface</text>
  <text x="858" y="150" text-anchor="middle" font-size="14" fill="#875a38">simple, compact, guarded tools</text>

  <g font-size="14" font-weight="600" text-anchor="middle">
    <rect x="692" y="174" width="76" height="42" rx="8" fill="#ffffff" stroke="#e2a36e"/>
    <text x="730" y="200" fill="#7b4218">search</text>
    <rect x="780" y="174" width="76" height="42" rx="8" fill="#ffffff" stroke="#e2a36e"/>
    <text x="818" y="200" fill="#7b4218">view</text>
    <rect x="868" y="174" width="76" height="42" rx="8" fill="#ffffff" stroke="#e2a36e"/>
    <text x="906" y="200" fill="#7b4218">edit</text>
    <rect x="956" y="174" width="76" height="42" rx="8" fill="#ffffff" stroke="#e2a36e"/>
    <text x="994" y="200" fill="#7b4218">execute</text>
  </g>

  <!-- ACI down to environment -->
  <path d="M858 252 V301" fill="none" stroke="#52606d" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Environment -->
  <rect x="665" y="312" width="385" height="92" rx="12" fill="#edf8f1" stroke="#3f8b5c" stroke-width="2.5"/>
  <text x="858" y="345" text-anchor="middle" font-size="18" font-weight="700" fill="#24663f">Computer environment</text>
  <text x="858" y="372" text-anchor="middle" font-size="14" fill="#3e7052">repository · linter · programs · tests</text>
  <text x="858" y="391" text-anchor="middle" font-size="13" fill="#62816e">action executes and changes the state</text>

  <!-- Environment to observation -->
  <path d="M665 358 H580" fill="none" stroke="#52606d" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Observation -->
  <rect x="340" y="300" width="240" height="136" rx="14" fill="#f2edf9" stroke="#7655a6" stroke-width="2.5"/>
  <text x="460" y="334" text-anchor="middle" font-size="18" font-weight="700" fill="#50347c">ACI observation</text>
  <text x="460" y="361" text-anchor="middle" font-size="14" fill="#634c82">concise environment feedback</text>
  <text x="460" y="384" text-anchor="middle" font-size="14" fill="#634c82">+ managed interaction history</text>
  <rect x="402" y="397" width="116" height="29" rx="14" fill="#ffffff" stroke="#b3a0cc"/>
  <text x="460" y="417" text-anchor="middle" font-size="12" font-weight="600" fill="#7655a6">OBSERVATION</text>

  <!-- Feedback loop -->
  <path d="M340 358 H290 Q275 358 275 343 V276 Q275 261 290 261 H435 Q450 261 450 242" fill="none" stroke="#7655a6" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="282" y="326" text-anchor="end" font-size="13" font-weight="600" fill="#7655a6">repeat</text>

  <!-- Submit exit -->
  <path d="M460 436 V468 H612" fill="none" stroke="#2673c9" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="625" y="446" width="235" height="62" rx="12" fill="#eaf3fd" stroke="#2673c9" stroke-width="2"/>
  <text x="743" y="473" text-anchor="middle" font-size="17" font-weight="700" fill="#174f8a">Submit final patch</text>
  <text x="743" y="494" text-anchor="middle" font-size="13" fill="#416d94">when the issue is resolved</text>
</svg>
